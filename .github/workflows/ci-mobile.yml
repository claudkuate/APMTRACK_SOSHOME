name: ci-mobile

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  mobile-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-agent
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

