name: ci-web

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json
      - run: npm ci
      - run: npm run build

