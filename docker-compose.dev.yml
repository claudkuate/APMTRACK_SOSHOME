name: apmtrack

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: apmtrack-postgres
    environment:
      POSTGRES_DB: apmtrack
      POSTGRES_USER: apmtrack
      POSTGRES_PASSWORD: apmtrack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - apmtrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apmtrack -d apmtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: apmtrack-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: apmtrack
      MINIO_ROOT_PASSWORD: apmtrack_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - apmtrack_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: apmtrack-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 apmtrack apmtrack_dev_password &&
      mc mb --ignore-existing local/apmtrack-pv-photos &&
      echo 'bucket apmtrack-pv-photos ready'
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: apmtrack-api
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: apmtrack-pv-photos
      S3_ACCESS_KEY: apmtrack
      S3_SECRET_KEY: apmtrack_dev_password
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://apmtrack:apmtrack_dev_password@postgres:5432/apmtrack
      DATABASE_MAX_CONNECTIONS: 5
      DATABASE_ACQUIRE_TIMEOUT_SECONDS: 3
      JWT_SECRET: dev_secret_minimum_32_chars_apmtrack_2026
      JWT_ACCESS_TOKEN_TTL_MINUTES: 15
      JWT_REFRESH_TOKEN_TTL_DAYS: 7
      RUN_MIGRATIONS_ON_STARTUP: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      PUBLIC_API_URL: http://localhost:8080
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_LOGIN_MAX: 10
      RATE_LIMIT_PUBLIC_MAX: 60
    ports:
      - "8080:8080"

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        NG_APP_API_URL: http://localhost:8080
        NG_APP_ENV: development
    container_name: apmtrack-web-admin
    depends_on:
      - api
    ports:
      - "4200:80"

  adminer:
    image: adminer:4
    container_name: apmtrack-adminer
    depends_on:
      - postgres
    ports:
      - "8081:8080"

volumes:
  apmtrack_postgres_data:
  apmtrack_minio_data:
