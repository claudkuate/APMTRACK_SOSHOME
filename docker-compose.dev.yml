name: apmtrack

services:
  postgres:
    image: postgres:16
    container_name: apmtrack-postgres
    environment:
      POSTGRES_DB: apmtrack
      POSTGRES_USER: apmtrack
      POSTGRES_PASSWORD: apmtrack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - apmtrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apmtrack -d apmtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: apmtrack-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://apmtrack:apmtrack_dev_password@postgres:5432/apmtrack
      DATABASE_MAX_CONNECTIONS: 5
      DATABASE_ACQUIRE_TIMEOUT_SECONDS: 3
      JWT_SECRET: dev_secret_minimum_32_chars_apmtrack_2026
      JWT_ACCESS_TOKEN_TTL_MINUTES: 15
      JWT_REFRESH_TOKEN_TTL_DAYS: 7
      RUN_MIGRATIONS_ON_STARTUP: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      PUBLIC_API_URL: http://localhost:8080
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_LOGIN_MAX: 10
      RATE_LIMIT_PUBLIC_MAX: 60
    ports:
      - "8080:8080"

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        NG_APP_API_URL: http://localhost:8080
        NG_APP_ENV: development
    container_name: apmtrack-web-admin
    depends_on:
      - api
    ports:
      - "4200:80"

  adminer:
    image: adminer:4
    container_name: apmtrack-adminer
    depends_on:
      - postgres
    ports:
      - "8081:8080"

volumes:
  apmtrack_postgres_data:
